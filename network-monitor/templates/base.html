<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Attack &amp; Monitoring Framework{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Optional Chart.js CDN for visual protocol distribution; degrades gracefully if offline -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-shield">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <circle cx="12" cy="11" r="3"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">NetMonitor</span>
                    <span class="brand-version">v1.0 • Lab Edition</span>
                </div>
            </div>

            <div class="sidebar-status-box">
                <div class="status-indicator-group">
                    <span class="status-dot" id="sidebar-status-dot"></span>
                    <span class="status-label" id="sidebar-status-text">INITIALIZING</span>
                </div>
                <div class="iface-tag">
                    <span class="iface-icon">⚡</span>
                    <span id="sidebar-iface-text">lo</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard_page') }}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('packets_page') }}" class="nav-item {% if active_page == 'packets' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    <span>Live Packets</span>
                </a>
                <a href="{{ url_for('alerts_page') }}" class="nav-item {% if active_page == 'alerts' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <span>Alerts</span>
                    <span class="badge-alert-count" id="sidebar-alert-badge" style="display:none;">0</span>
                </a>
                <a href="{{ url_for('hosts_page') }}" class="nav-item {% if active_page == 'hosts' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                    <span>Active Hosts</span>
                </a>
                <a href="{{ url_for('settings_page') }}" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <p class="project-tag">BSIT Semester Project</p>
                <p class="security-notice">Defensive Lab Use Only</p>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="main-content">
            <!-- Top Control Bar -->
            <header class="topbar">
                <div class="topbar-title-section">
                    <h1 class="header-main-title">Network Attack &amp; Monitoring Framework</h1>
                    <p class="header-subtitle">Real-Time Defensive Network Security Monitoring</p>
                </div>

                <div class="topbar-controls">
                    <!-- Interface Picker -->
                    <div class="control-group">
                        <label for="iface-select" class="control-label">Interface:</label>
                        <select id="iface-select" class="form-select">
                            <option value="">Detecting...</option>
                        </select>
                    </div>

                    <!-- Start / Stop Action Buttons -->
                    <div class="control-group buttons-group">
                        <button id="btn-start-monitor" class="btn btn-primary" onclick="startMonitoring()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            START MONITORING
                        </button>
                        <button id="btn-stop-monitor" class="btn btn-danger" onclick="stopMonitoring()" disabled>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
                            STOP MONITORING
                        </button>
                    </div>
                </div>
            </header>

            <!-- Global Toast / Notice Area -->
            <div id="toast-container" class="toast-container"></div>

            <!-- Page Body -->
            <section class="page-body">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <!-- Application JavaScript -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
